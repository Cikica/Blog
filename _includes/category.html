<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Overpass+Mono:wght@300..700&family=Sen:wght@400..800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ '/main.css' | url }}">

    <title>Old Roots New Shoots - {{ title }}</title>
</head>

<body>
    <div class="home">
        <header class="home__header">
            <h1 class="home__title">
                {{ title }}
            </h1>
            <div class="home__description">
                {{ description }}
            </div>
        </header>
        <main class="home__content">
            {{ content }}
        </main>
    </div>
</body>

</html>
